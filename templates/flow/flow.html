{% extends "base.html" %}

{% block title %}Flow Timer{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <h1 class="title">Flow Timer</h1>
        <div id="timer" class="has-text-centered">
            <h2 class="title is-2" id="time-display">00:00:00</h2>
            <div class="select">
                <select id="pause-interval">
                    <option value="1800">Pausa cada 30 minutos</option>
                    <option value="3600">Pausa cada 1 hora</option>
                    <option value="7200" selected>Pausa cada 2 horas</option>
                </select>
            </div>
            <br><br>
            <button class="button is-success" id="start-btn">Start</button>
            <button class="button is-link" id="stop-btn" disabled>Stop</button>
            <button class="button" style="background-color: #C70039; color: white;" id="reset-btn" disabled>Reset</button>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    let timer;
    let totalTime = 0;  // Total time in seconds
    let pauseInterval = 7200; // Default to 2 hours in seconds

    const timeDisplay = document.getElementById('time-display');
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const resetBtn = document.getElementById('reset-btn');
    const pauseIntervalSelect = document.getElementById('pause-interval');

    pauseIntervalSelect.addEventListener('change', function() {
        pauseInterval = parseInt(this.value);
        localStorage.setItem('pauseInterval', pauseInterval); // Guardar en localStorage
    });

    function saveTimerState() {
        localStorage.setItem('startTime', Date.now());
        localStorage.setItem('totalTime', totalTime);
    }

    function restoreTimerState() {
        const savedStartTime = localStorage.getItem('startTime');
        const savedTotalTime = localStorage.getItem('totalTime');
        const savedPauseInterval = localStorage.getItem('pauseInterval');

        if (savedPauseInterval) {
            pauseInterval = parseInt(savedPauseInterval);
            pauseIntervalSelect.value = pauseInterval;
        }

        if (savedStartTime) {
            const elapsed = Math.floor((Date.now() - savedStartTime) / 1000);
            totalTime = parseInt(savedTotalTime) + elapsed;

            let hours = Math.floor(totalTime / 3600);
            let minutes = Math.floor((totalTime % 3600) / 60);
            let seconds = totalTime % 60;

            timeDisplay.textContent = 
                (hours < 10 ? '0' + hours : hours) + ':' +
                (minutes < 10 ? '0' + minutes : minutes) + ':' +
                (seconds < 10 ? '0' + seconds : seconds);

            if (totalTime < pauseInterval) {
                startTimer();
            }
        }
    }

    function startTimer() {
        startBtn.disabled = true;
        stopBtn.disabled = false;
        resetBtn.disabled = true;

        saveTimerState();

        timer = setInterval(function() {
            totalTime++;
            let hours = Math.floor(totalTime / 3600);
            let minutes = Math.floor((totalTime % 3600) / 60);
            let seconds = totalTime % 60;

            timeDisplay.textContent = 
                (hours < 10 ? '0' + hours : hours) + ':' +
                (minutes < 10 ? '0' + minutes : minutes) + ':' +
                (seconds < 10 ? '0' + seconds : seconds);

            // Asignar un punto cada 30 minutos (1800 segundos)
            if (totalTime % 1800 === 0) {  // Temporalmente, cada segundo para pruebas
                assignPointToUser();  // Llamar a la función para asignar puntos
            }

            // Verificar si se alcanzó el intervalo de pausa
            if (totalTime % pauseInterval === 0) {
                alert("¡Enhorabuena por mantener tu Flow! Es hora de tomar un descanso.");
                stopTimer(); // Detener el temporizador automáticamente
            }

            saveTimerState();  // Guardar el estado en cada iteración
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timer);
        startBtn.disabled = false;
        stopBtn.disabled = true;
        resetBtn.disabled = false;
        localStorage.removeItem('startTime');  // Eliminar el tiempo de inicio
    }

    function resetTimer() {
        totalTime = 0;
        timeDisplay.textContent = "00:00:00";
        resetBtn.disabled = true;
        localStorage.removeItem('startTime');  // Eliminar el tiempo de inicio
        localStorage.removeItem('totalTime');  // Eliminar el tiempo total
    }

    startBtn.addEventListener('click', startTimer);
    stopBtn.addEventListener('click', stopTimer);
    resetBtn.addEventListener('click', resetTimer);

    function assignPointToUser() {
        // Hacer una solicitud AJAX al servidor para asignar un punto
        fetch('/flow/assign-point/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'  // Incluir el CSRF token para la seguridad
            },
            body: JSON.stringify({ 'duration': 30 })  // Opcional: pasar datos adicionales
        })
        .then(response => response.json())
        .then(data => {
            console.log('Punto asignado:', data);
        })
        .catch((error) => {
            console.error('Error al asignar el punto:', error);
        });
    }

    function notifyUser(message) {
        if (Notification.permission === "granted") {
            new Notification(message);
        } else if (Notification.permission !== "denied") {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    new Notification(message);
                }
            });
        }
    }

    if ("Notification" in window) {
        Notification.requestPermission();
    }

    // Restaurar el estado del temporizador cuando se carga la página
    restoreTimerState();
</script>
{% endblock %}
