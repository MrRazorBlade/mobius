<!DOCTYPE html>
<html lang="en">
{% load custom_filters %}


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Habit</title>
    <!-- Enlace a Bulma CSS desde CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.3/css/bulma.min.css">
</head>
<body>
    <section class="section">
        <div class="container">
            <h1 class="title has-text-centered">Add New Habit</h1>
            <div class="box">
                <form method="post">
                    {% csrf_token %}
                    <div class="field">
                        {{ form.name.label_tag }}
                        <div class="control">
                            {{ form.name|add_class:"input" }}
                        </div>
                    </div>
                    <div class="field is-grouped is-grouped-right">
                        <div class="control">
                            <button class="button is-link" type="submit">Add Habit</button>
                        </div>
                        <div class="control">
                            <a class="button is-light" href="{% url 'tracker:index' %}">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
